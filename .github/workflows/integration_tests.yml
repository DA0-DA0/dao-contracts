name: Integration Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      GAS_OUT_DIR: gas_reports
      GAS_LIMIT: 100000000
    steps:
      - name: Checkout sources
        uses: actions/checkout@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install nightly-2024-01-08 toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly-2024-01-08
          target: wasm32-unknown-unknown
          override: true

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Rust Dependencies Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            artifacts/
          key: ${{ runner.os }}-cargo-with-artifacts-${{ hashFiles('**/Cargo.lock') }}

      # Fails when Juno mainnet's block gas limit differs from GAS_LIMIT. The
      # public RPC sometimes returns an empty or invalid response; retry a few
      # times, then skip the comparison with a warning instead of failing.
      - name: Mainnet block GAS_LIMIT changed
        shell: bash
        env:
          CONSENSUS_PARAMS_URL: https://juno-rpc.polkachu.com/consensus_params
        run: |
          attempts=4
          mainnet=""
          for attempt in $(seq 1 "$attempts"); do
            mainnet=$(curl -sf --max-time 20 "$CONSENSUS_PARAMS_URL" | jq -r '.result.consensus_params.block.max_gas' 2>/dev/null || true)
            if [[ "$mainnet" =~ ^-?[0-9]+$ ]]; then
              break
            fi
            echo "attempt $attempt/$attempts: no valid max_gas in the response (got '${mainnet}')"
            mainnet=""
            if [ "$attempt" -lt "$attempts" ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ -z "$mainnet" ]; then
            echo "::warning::Could not read Juno mainnet's block GAS_LIMIT from $CONSENSUS_PARAMS_URL after $attempts attempts; skipping the GAS_LIMIT check"
            exit 0
          fi
          if [ "$mainnet" != "$GAS_LIMIT" ]; then
            echo "::error::Integration tests must update GAS_LIMIT from $GAS_LIMIT to $mainnet"
            exit 1
          fi
          echo "Juno mainnet block GAS_LIMIT is $mainnet, matching GAS_LIMIT"

      - name: Run Integration Tests
        run: just integration-test

      - name: Upload contract artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.wasm
            artifacts/checksums.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Combine Test Gas Reports
        run: cd ci/integration-tests/ && jq -rs 'reduce .[] as $item ({}; . * $item)' gas_reports/*.json > gas_report.json

      - name: Raw Gas Report
        run: cat ci/integration-tests/gas_report.json

      - name: Set GIT_BRANCH
        run: echo "GIT_BRANCH=$(echo ${{ github.ref }} | sed 's|/|-|g')" >> $GITHUB_ENV

      - name: Upload Gas Report
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: dao-dao-gas-report-${{ env.GIT_BRANCH }}
          path: ci/integration-tests/gas_report.json
          retention-days: 90

      - name: Download main gas report
        id: download_gas
        # Because the max retention period of github artifacts is 90 days
        # there's a possibility the main's report no longer exists
        continue-on-error: true
        if: ${{ github.ref != 'refs/heads/main' }}
        # NOTE: We can't use github's `actions/download-artifact` because it doesnt support
        # downloading an artifact cross workflows yet
        # https://github.com/actions/download-artifact/issues/3
        uses: dawidd6/action-download-artifact@v2
        with:
          branch: main
          workflow: integration_tests.yml
          name: dao-dao-gas-report-refs-heads-main

      - name: Post gas diff to PR
        if: ${{ github.ref != 'refs/heads/main' && steps.download_gas.outputs.found_artifact == 'true' }}
        uses: de-husk/cosm-orc-gas-diff-action@v0.6.2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          current_json: ci/integration-tests/gas_report.json
          old_json: gas_report.json
