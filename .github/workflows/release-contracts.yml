name: Release contracts

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - ci/release-contracts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      # run the optimizer exactly as `just workspace-optimize` does on x86, not
      # as a container job. panic locations embed absolute source paths, so the
      # source must be at /code (not the runner's checkout path) for these
      # artifacts to match a local build byte for byte.
      - name: Compile contracts
        timeout-minutes: 60
        run: |
          docker run --rm -v "$(pwd)":/code \
            --mount type=volume,source="$(basename "$(pwd)")_cache",target=/target \
            --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
            --platform linux/amd64 \
            cosmwasm/optimizer:0.16.1

      - name: Upload contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: artifacts/

      - name: release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
