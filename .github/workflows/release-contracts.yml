name: Release contracts

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - ci/release-contracts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install just
        uses: extractions/setup-just@v1

      # use the same recipe as local builds and the test workflows, not a
      # container job: panic locations embed absolute source paths, so the
      # source must be mounted at /code (not the runner's checkout path) for
      # these artifacts to match a local build byte for byte. The recipe also
      # runs scripts/optimize.sh (the image's build script plus one wasm-opt
      # flag) and fails if an artifact exceeds cosmwasm-vm's locals limits.
      - name: Compile contracts
        timeout-minutes: 60
        run: just workspace-optimize

      - name: Upload contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: artifacts/

      - name: release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          append_body: true
          body: |
            ## Reproducing these artifacts

            The contract artifacts and `checksums.txt` were built with `just workspace-optimize` at the tagged commit on x86_64 (`cosmwasm/optimizer:0.16.1` running `scripts/optimize.sh`, which adds `--one-caller-inline-max-function-size=15` to `wasm-opt`). To reproduce them byte for byte, check out the tag and run `just workspace-optimize`, or the equivalent command documented in the README's "Runtime compatibility" section. The stock optimizer command produces different checksums.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
