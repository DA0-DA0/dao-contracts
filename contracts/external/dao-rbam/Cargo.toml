[package]
name = "dao-rbam"
authors = ["Noah Saso <noah@daodao.zone>"]
description = "Role-based Authorization Module (RBAM) lets DAOs configure organization-wide roles and authorization policies."
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-std = { workspace = true, features = ["cosmwasm_1_2"] }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
dao-interface = { workspace = true }
thiserror = { workspace = true }
cw-utils = { workspace = true }
cw-ownable = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cw2 = { workspace = true }
cw-filter = { workspace = true, features = ["library"] }
cw-protobuf-registry = { workspace = true, features = ["library"] }

[dev-dependencies]
chrono = { workspace = true }
cw-multi-test = { workspace = true }
dao-interface = { workspace = true }
dao-rbam = { workspace = true }
dao-testing = { workspace = true }
cw4 = { workspace = true }
osmosis-std = { workspace = true }
osmosis-std-derive = { workspace = true }
cw-jsonfilter = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
prost-types = { workspace = true }
