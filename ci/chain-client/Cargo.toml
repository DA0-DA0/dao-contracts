[package]
name = "dao-chain-client"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = "1.75"

# CI support only: never include the network/signing stack in contract Wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cosmrs = { version = "=0.22.0", default-features = false, features = ["bip32", "cosmwasm"] }
tendermint-rpc = { version = "=0.40.4", default-features = false, features = ["http-client"] }
bip32 = { version = "=0.5.3", features = ["bip39"] }
tokio = { version = "1.38.1", features = ["rt", "time", "macros", "net", "io-util"] }
sha2 = "0.10.8"
base64 = { workspace = true }
# Configure the existing transport explicitly: redirects must not resubmit a tx.
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
signature = "2.2.0"
once_cell = { workspace = true }
